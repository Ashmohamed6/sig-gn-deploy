services:
  db:
    image: postgis/postgis:17-3.5
    container_name: siggn_db
    env_file:
      - ${SIGGN_ENV_PROD_FILE:-./env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  backend:
    build:
      context: ../sig-gn-backend
    container_name: siggn_backend
    env_file:
      - ${SIGGN_ENV_PROD_FILE:-./env.prod}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
          --bind 0.0.0.0:8000
          --workers 3
          --timeout 120
      "
    restart: always

  frontend:
    build:
      context: ../sig-gn-frontend
      dockerfile: Dockerfile
    container_name: siggn_frontend
    env_file:
      - ${SIGGN_ENV_PROD_FILE:-./env.prod}
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: siggn_nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

volumes:
  pgdata:
